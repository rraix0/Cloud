version: "3.9"
services:
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL}
    restart: always
    ports:
      - "82:80"
    environment:
      - VITE_API_URL=${VITE_API_URL}
    networks:
      - dokploy-network
  backend:
    build: ./backend
    restart: always
    environment:
      - ROCKET_ADDRESS=${ROCKET_ADDRESS}
      - ROCKET_PORT=${ROCKET_PORT}
      - AWS_REGION=${AWS_REGION}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL}
      - AWS_ENDPOINT_PUBLIC_URL=${AWS_ENDPOINT_PUBLIC_URL}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_BUCKET=${AWS_BUCKET}
      - SURREAL_HOST=${SURREAL_HOST}
      - SURREAL_NAMESPACE=${SURREAL_NAMESPACE}
      - SURREAL_DATABASE=${SURREAL_DATABASE}
      - SURREAL_USERNAME=${SURREAL_USERNAME}
      - SURREAL_PASSWORD=${SURREAL_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - frontend
    ports:
      - "8090:8000"
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
