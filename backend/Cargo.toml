[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
rocket = { version = "0.5.1", features = ["json"] }
rocket_cors = "0.6.0"
serde = { version = "1.0.219", features = ["derive"] }
surrealdb = "2.0.4"
uuid = { version = "1.16.0", features = ["v7"] }
dotenvy = "0.15.7"
aws-config = "1.8.8"
tokio = { version = "1.47.1", features = ["full"] }
aws-sdk-s3 = "1.108.0"
bytes = "1.10.1"
jsonwebtoken =  { version = "10.1.0", features = ["rust_crypto"] }
chrono = "0.4.42"
image = "0.25.8"
webp = "0.3.1"
once_cell = "1.21.3"